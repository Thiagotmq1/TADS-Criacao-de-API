<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalhes do Produto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="topo"></header>

  <main class="container">
    <a href="index.html" class="btn btn-link px-0 mt-3"><i class="bi bi-arrow-left"></i> Voltar</a>
    <div id="mensagem"></div>
    <div class="row g-4 mt-1" id="detalhe"></div>
  </main>

  <footer id="creditos"></footer>

  <!-- Confirmacao de exclusao -->
  <div class="modal fade" id="modalExcluir" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Confirmar exclusão</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">Deseja realmente excluir <b id="excluirNome"></b>? Esta ação não pode ser desfeita.
      <div id="excluirErro" class="alert alert-danger mt-3 d-none"></div></div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      <button class="btn btn-danger" id="btnConfirmarExcluir">Sim, excluir</button></div>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/detalhes.js"></script>
</body>
</html>
