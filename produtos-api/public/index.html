<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home - Loja de Produtos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="topo"></header>

  <main class="container">
    <h2 class="secao">Destaque</h2>
    <div class="destaque">
      <div id="carrossel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators" id="carrosselIndicadores"></div>
        <div class="carousel-inner" id="carrosselItens"></div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carrossel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
        <button class="carousel-control-next" type="button" data-bs-target="#carrossel" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center" id="produtos">
      <h2 class="secao flex-grow-1 me-3">Últimos produtos</h2>
      <button class="btn btn-primary" id="btnNovo"><i class="bi bi-plus-lg"></i> Novo produto</button>
    </div>
    <div id="mensagem"></div>
    <div class="row g-3" id="lista"></div>
  </main>

  <footer id="creditos"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
